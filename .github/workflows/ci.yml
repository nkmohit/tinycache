name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.5.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Fuzz smoke
        run: |
          go test -run=^$ -fuzz=FuzzParseTTL -fuzztime=20s ./internal/cache
          go test -run=^$ -fuzz=FuzzDecodeAOF -fuzztime=20s ./internal/cache
          go test -run=^$ -fuzz=FuzzHTTPCommands -fuzztime=20s ./internal/httpapi
